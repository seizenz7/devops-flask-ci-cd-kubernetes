# =====================================================
# Nama workflow (akan muncul di tab Actions GitHub)
name: CI/CD - Build & Push Docker Image

# =====================================================
# Kapan workflow ini dijalankan?
# - Setiap push ke branch main
# - Setiap ada Pull Request ke branch main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# =====================================================
# Bagian "jobs" = apa yang dilakukan robot
jobs:
  build-and-push:
    # Runner: mesin Ubuntu terbaru milik GitHub (gratis 2000 menit/bulan)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Ambil semua kode dari repo 
        # Penjelasan: action resmi GitHub untuk mendownload repo ke runner
      - name: Checkout code
        uses: actions/checkout@v4
     

      # Step 2: Setup Docker Buildx (untuk build yang lebih cepat & advanced)
        # Penjelasan: Buildx adalah engine Docker modern yang support caching dan multi-platform
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
       

      # Step 3: Login ke Docker Hub (pakai Secrets supaya aman)
        # Penjelasan: Tanpa login ini, push ke Docker Hub akan gagal
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # ${{ secrets.NAMA }} = ambil nilai dari GitHub Secrets
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # Step 4: Build & Push image (inti dari CI/CD)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .                    # Gunakan folder root sebagai context build
          push: true                    # Langsung push image ke Docker Hub
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-flask:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-flask:${{ github.sha }}
          # Penjelasan tag: 
          # - latest = versi terbaru
          # - github.sha = commit hash (untuk traceability)

          # Caching best practice (membuat build 5-10x lebih cepat di push berikutnya)
          cache-from: type=gha
          cache-to: type=gha,mode=max
