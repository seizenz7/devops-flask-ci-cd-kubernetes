# =====================================================
# Nama workflow (akan muncul di tab Actions GitHub)
name: CI/CD - Build, Test, and Push Docker Image

# =====================================================
# Kapan workflow ini dijalankan?
# - Setiap push ke branch main (kecuali perubahan pada file README.md dan folder screenshots)
# - Setiap ada Pull Request ke branch main (kecuali perubahan pada file README.md dan folder screenshots)
on:
  push:
    branches: 
      - main
    paths-ignore:
      - "README.md"
      - "screenshots/*"
  pull_request:
    branches: 
      - main
    paths-ignore:
      - "README.md"
      - "screenshots/*"
# Restrict permissions untuk keamanan (hanya baca konten repo, tidak bisa buat PR atau push)
permissions:
  contents: read
  packages: write
# =====================================================
# Bagian "jobs" = apa yang dilakukan robot
jobs:
  # Job pertama: Jalankan unit tests dengan pytest
  test:
    # Runner: mesin Ubuntu terbaru milik GitHub (gratis 2000 menit/bulan)
    runs-on: ubuntu-latest
    # Langkah-langkah yang akan dijalankan di dalam job ini
    steps:
        # Step 1: Ambil semua kode dari repo ke runner menggunakan action resmi GitHub
      - name: Checkout code
        uses: actions/checkout@v4

        # Step 2: Setup Python (untuk menjalankan pytest) menggunakan action resmi GitHub
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

        # Step 3: Install dependencies yang diperlukan dari file requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/
  # Job kedua: Build image dan push ke Docker Hub
  build-and-push:
    # Pastikan job "test" selesai dan sukses sebelum lanjut ke job build-and-push
    needs: test
    # Runner: mesin Ubuntu terbaru milik GitHub (gratis 2000 menit/bulan)
    runs-on: ubuntu-latest
    # Langkah-langkah yang akan dijalankan di dalam job ini
    steps:
      # Step 1: Ambil semua kode dari repo ke runner menggunakan action resmi GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Docker Buildx (untuk build yang lebih cepat & advanced)
        # Penjelasan: Buildx adalah engine Docker modern yang support caching dan multi-platform
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login ke Docker Hub (pakai Secrets supaya aman)
        # Penjelasan: Tanpa login ini, push ke Docker Hub akan gagal
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # Ambil nilai dari GitHub Secrets yang sudah di set di repo (Settings > Secrets)
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build & Push image 
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .                    # Gunakan folder root sebagai context build
          push: true                    # Langsung push image ke Docker Hub
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:${{ github.sha }}
          # Penjelasan tag: 
          # - latest = versi terbaru
          # - github.sha = commit hash (untuk traceability)

          # Caching best practice (membuat build 5-10x lebih cepat di push berikutnya)
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  # Job ketiga: Integration testing deployment k8s menggunakan KinD
  integration-test:
    # Pastikan job "build-and-push" sudah selesai dan sukses sebelum lanjut ke job integration-test
    needs: build-and-push
    # Runner: mesin Ubuntu terbaru milik GitHub (gratis 2000 menit/bulan)
    runs-on: ubuntu-latest
    # Langkah - langkah yang akan dijalankan di dalam job ini
    steps:
      # Step 1: Ambil semua kode dari repo ke runner menggunakan action resmi GitHub
      - name: Checkout code
        uses: actions/checkout@v4
      # Step 2: Buat Cluster K8s di dalam runner 
      - name: Create KinD Cluster
        uses: engineerd/setup-kind@v0.5.0
        with:
          version: "v0.20.0"
      # Step 3: Update manifest K8s dengan image tag yang baru (SHA dari commit) menggunakan kustomize
      - name: Update Image Tag
        # Masuk ke folder dimana manifest berada. Jika belum ada kustomization.yaml, kita buat secara dinamis 
        # Ubah image ke SHA yang baru dengan perintah kustomize edit set image
        run: |
          cd k8s
          if [ ! -f kustomization.yaml ]; then
            kustomize create --resources deployment.yaml,service.yaml
          fi
          kustomize edit set image flask-app=${{ secrets.DOCKERHUB_USERNAME }}/flask-app:${{ github.sha }}
      # Step 4: Deploy aplikasi ke cluster KinD menggunakan kubectl apply -k (flag -k = kustomize) untuk menerapkan perubahan dari step sebelumnya
      - name: Deploy to KinD
        run: |
          kubectl cluster-info
          kubectl apply -k k8s/
      # Step 5: Tunggu sampai pod running dan siap menerima request
      - name: Wait for pod to be ready
        run: |
          kubectl rollout status deployment/flask-app --timeout=120s
      # Step 6: Jalankan integration test (misal pakai curl untuk cek endpoint)
      - name: Run integration test
        run: |
          # Dapatkan IP Pod secara dinamis
          POD_NAME=$(kubectl get pods -l app=flask-app -o jsonpath="{.items[0].metadata.name}")
          # Tes akses HTTP ke port 5000 di dalam pod
          kubectl exec $POD_NAME -- curl -s localhost:5000/health | grep "healthy"
          echo "Integration test passed!"